[metadata]
name = jupyter-remote-kernel
version = 0.1.0
description = Run Jupyter kernels on remote machines through a reverse WebSocket tunnel

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.6
install_requires =
    aiohttp>=3.6

[options.packages.find]
where = src

[options.data_files]
etc/jupyter/jupyter_server_config.d =
    jupyter-config/server_config.d/jupyter_remote_kernel.json

[options.extras_require]
hub =
    jupyter_server>=1.0
test =
    pytest>=8
    pytest-asyncio>=0.24
    pytest-timeout

[options.entry_points]
console_scripts =
    jupyter-remote-kernel = jupyter_remote_kernel.cli:main
jupyter_server.extension_paths =
    jupyter_remote_kernel = jupyter_remote_kernel.server_extension
